[package]
name = "mibee-eye-thermal"
version = "0.0.1"
edition = "2021"
rust-version = "1.83"
description = "MiBee Eye thermal imaging camera — MLX90640 (32x24 IR array) to GB28181/RTSP/Web"
license = "Apache-2.0"
repository = "https://github.com/xiqing85/mibee-eye-thermal"
publish = false

[dependencies]
libc = "0.2"
gb28181-rs = "0.14.1"
openh264 = "0.9.8"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs"] }
toml = "0.8"
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
